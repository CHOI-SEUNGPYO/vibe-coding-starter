# Optional: the connected GitHub plugin is preferable when already available.
# Set the token in the launching process, never in this repository.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"
http_headers = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "repos,issues,pull_requests,actions" }
startup_timeout_sec = 30
tool_timeout_sec = 60
